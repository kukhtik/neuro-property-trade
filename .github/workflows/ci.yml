name: ci

# The rules engine is deterministic and headless-testable, so every push is
# gated on exactly what a contributor runs locally:
#   tools/ci/run_tests.sh          - import pass + suite + SCRIPT ERROR gate
#   res://tools/replay_cli.gd      - every recorded game replays to its
#                                    recorded state fingerprint
#   res://tools/soak_cli.gd        - seeded sweeps must not stall or break the
#                                    ownership/cash invariants
# Godot is PINNED (.tools/godot-version) and checksum-verified: replay
# fingerprints are only guaranteed within a single engine build.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: rules engine (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.tools/godot-version') }}

      - name: Fetch pinned Godot (sha512-verified)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip >/dev/null
          tools/ci/fetch_godot.sh

      - name: Oracle - import pass + test suite + SCRIPT ERROR gate
        run: tools/ci/run_tests.sh

      - name: Determinism - replay every recorded game log
        run: |
          # `$PWD/tools/ci/godot_bin.sh` is the SCRIPT, not the binary. Invoking the script with
          # `--headless ...` makes bash run it, ignore every argument, print the binary path and
          # exit 0 — so this step was green while running NOTHING. Run the script to get the path.
          G="$(tools/ci/godot_bin.sh)"
          "$G" --headless --path game --script res://tools/replay_cli.gd -- --verify-all corpus/games

      - name: Corpus - regenerate a batch and verify decision-replay
        run: |
          # `$PWD/tools/ci/godot_bin.sh` is the SCRIPT, not the binary. Invoking the script with
          # `--headless ...` makes bash run it, ignore every argument, print the binary path and
          # exit 0 — so this step was green while running NOTHING. Run the script to get the path.
          G="$(tools/ci/godot_bin.sh)"
          # A project-relative output path keeps the contract identical on Linux
          # and on a Windows/Git-bash checkout (build/ is git-ignored).
          OUT="build/corpus"
          "$G" --headless --path game --script res://tools/corpus.gd -- --out "$OUT" --games 4 --seed 20000 --turns 250
          "$G" --headless --path game --script res://tools/replay_cli.gd -- --verify-all "$OUT"

      - name: Seeded soak - no stalls, invariants hold
        run: |
          # `$PWD/tools/ci/godot_bin.sh` is the SCRIPT, not the binary. Invoking the script with
          # `--headless ...` makes bash run it, ignore every argument, print the binary path and
          # exit 0 — so this step was green while running NOTHING. Run the script to get the path.
          G="$(tools/ci/godot_bin.sh)"
          for players in 2 3 4; do
            "$G" --headless --path game --script res://tools/soak_cli.gd -- --sweep 20 --seed 2000 --turns 250 --players "$players"
          done

      - name: Behavioral probes - every probe in game/tools
        run: tools/ci/run_probes.sh

      # THE VISUAL HALF NEEDS ITS OWN TOOLCHAIN. SG-07 captures the shipping app and reads the
      # frames (Godot + Pillow) and renders the mockup (playwright); FILL then measures those frames.
      # Without them SG-07 skipped out loud, FILL found nothing to measure and went red claiming it
      # had checked something - a red that described the runner, not the product. xvfb gives Godot a
      # display to draw into.
      - name: Visual toolchain - Pillow, playwright, a virtual display
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pillow playwright
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Gates - functionality + structure (quarantine-aware, docs/restoration/gates.md)
        env:
          # the oracle above ran WITH the import pass; the gate re-runs it cheaply. Required
          # gates block; quarantine gates are reported in build/gates/report.html without
          # failing the build (the report is uploaded below).
          NPT_GATES_FAST: "1"
        run: |
          # xvfb-run gives every gate that opens a window something to draw on; gates that do not
          # need it are unaffected.
          xvfb-run -a --server-args="-screen 0 1920x1200x24" tools/ci/run_gates.sh --all

      - name: Design - the mockup vs the game (palette, dock widths, regions)
        run: |
          # The mockup is design/ui-prototype.html, GENERATED from the game, so this gate
          # catches drift: a skin whose palette no longer matches the design, or a region
          # the registry names but the prototype stopped declaring. Needs no Godot and no
          # Pillow: the frame-based dock-width check only runs when a smoke frame exists.
          python3 tools/ci/compare_mockup.py neuro

      - name: Design - the package checks itself (prototype vs game)
        run: python3 design/tools/check_package.py

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/npt-tests-*.log
          if-no-files-found: ignore

      - name: Upload gate report (verdicts, reasons, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            build/gates/report.html
            build/gates/*.json
            build/gates/*.log
          if-no-files-found: ignore
