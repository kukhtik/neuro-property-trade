name: web-export

# The WebGL build is the stream deliverable (docs/plan.md "Up next" #1). This
# produces it reproducibly and verifies the export actually emitted a bootable
# HTML5 bundle (real wasm + pck + loader). It does NOT click through the game in
# a real browser: that playthrough smoke is still manual, and frame capture under
# SwiftShader/llvmpipe is a known-unreliable environment (docs/plan.md risks).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  web:
    name: Godot Web export
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned Godot + export templates
        uses: actions/cache@v4
        with:
          path: |
            .tools/godot
            ~/.local/share/godot/export_templates
          key: godot-web-${{ runner.os }}-${{ hashFiles('.tools/godot-version') }}

      - name: Fetch pinned Godot (sha512-verified)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip >/dev/null
          tools/ci/fetch_godot.sh

      - name: Install export templates (pinned, sha512-verified)
        run: tools/ci/fetch_templates.sh

      - name: Export Web
        run: |
          # `$PWD/tools/ci/godot_bin.sh` is the SCRIPT, not the binary. Invoking the script with
          # `--headless ...` makes bash run it, ignore every argument, print the binary path and
          # exit 0 — so this step was green while running NOTHING. Run the script to get the path.
          G="$(tools/ci/godot_bin.sh)"
          mkdir -p build/web
          "$G" --headless --path game --import
          # Godot needs a NATIVE output path: "$PWD" is MSYS-form on a Git-bash
          # checkout and the export fails with "target folder does not exist".
          OUT="$(cd build/web && (pwd -W 2>/dev/null || pwd))"
          "$G" --headless --path game --export-release "Web" "$OUT/index.html"
          ls -la build/web

      - name: Verify the bundle is bootable
        run: tools/ci/verify_web_build.sh build/web

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 30
