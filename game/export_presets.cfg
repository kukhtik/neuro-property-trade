[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; C3 (обещание приёмки): тестовый код не едет в поставку — см. комментарий у пресета Web.
exclude_filter="tests/*"
export_path="build/windows/Neuro Property Trade.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=12345
encryption_key=""
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
# A CONSOLE WRAPPER, because the invitation is printed to stdout. Without it a double-click
# launches the game with no console at all, so the addresses and seat tokens the host must
# send to friends are written into a window that does not exist. With it, running the .exe
# shows the game window AND the console carrying the invitation. `true` here ships the
*console* wrapper binary; `debug/export_console_wrapper` is the debug-side switch.
debug/export_console_wrapper=1
binary_format/embed_pck=true
binary_format/console_wrapper=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="1.0.0"
application/product_version="1.0.0"
application/company_name="Neuro Property Trade"
application/product_name="Neuro Property Trade"
application/file_description="A property trading board game for Neuro-sama"
application/copyright="MIT"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
