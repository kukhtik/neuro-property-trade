[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; C3 (обещание приёмки): в поставку не едет ТЕСТОВЫЙ код. До этого `all_resources` +
; пустой exclude_filter отправляли игрокам весь `res://tests/` (39 модулей, ~1.2 МБ) —
; оракул при этом работает из ДЕРЕВА (`godot --script res://tests/run.gd`), а не из пака,
; поэтому исключение безопасно: `game/seats/seat_manager.gd` тянет `res://tools/replay.gd`
; (это продукт, его не трогаем). Паттерн — относительно res://, без префикса.
exclude_filter="tests/*"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=12345
encryption_key=""
script_export_mode=2

